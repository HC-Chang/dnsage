services:
  pihole:
    # Pi-hole v6 onward: the project does not publish pinned minor tags and its
    # config/data format can change across major releases, so 'latest' is the
    # officially recommended channel. Revisit if reproducibility is required.
    image: pihole/pihole:latest
    container_name: pihole
    ports:
      # Bind to the LAN interface so other machines can use this DNS, without
      # exposing it to the public internet (avoids becoming an open resolver).
      - "${DNS_BIND:-127.0.0.1}:53:53/tcp"
      - "${DNS_BIND:-127.0.0.1}:53:53/udp"
    environment:
      TZ: ${TZ:-Asia/Taipei}
      # Fail fast if no password is supplied instead of silently using 'admin'.
      WEBPASSWORD: ${PIHOLE_PASSWORD:?PIHOLE_PASSWORD must be set in .env}
      PIHOLE_DNS_: ${PIHOLE_DNS_:-9.9.9.9;1.1.1.1}
      PIHOLE_INTERFACE: ${PIHOLE_INTERFACE:-eth0}
      FTLCONF_dnslisteningmode: all
      DNSSEC: "true"
      CONDITIONAL_FORWARDING: "false"
    volumes:
      - pihole_etc:/etc/pihole
      - pihole_dnsmasq:/etc/dnsmasq.d
    restart: always
    healthcheck:
      test: ["CMD", "sh", "-c", "dig pi.hole @127.0.0.1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - dnsage-network

  postgres:
    image: pgvector/pgvector:pg16
    container_name: donut-hole-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-donuthole}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./donut-hole/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-donuthole}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dnsage-network
    restart: always

  pgadmin:
    image: dpage/pgadmin4:9.17
    container_name: donut-hole-pgadmin
    profiles:
      - debug
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@donuthole.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD must be set in .env}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "127.0.0.1:5050:80"
    networks:
      - dnsage-network
    restart: always

  backend:
    build:
      context: ./donut-hole/backend
      dockerfile: Dockerfile
    container_name: donut-hole-backend
    env_file:
      - .env
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-https://localhost}
      # Assemble the DSN from dedicated DB_* variables so the password is not
      # repeated inline in the compose file and survives special characters
      # ("," "@" etc. would otherwise need URL-encoding).
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?}:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-donuthole}
      PIHOLE_URL: http://pihole:80
      PIHOLE_PASSWORD: ${PIHOLE_PASSWORD:?}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set in .env (generate: openssl rand -hex 32)}"
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      EXPORT_PATH: /app/exports
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      # LLM / embedding config is owned by .env; only parameterize references here
      # so values have a single source of truth.
      LLM_PROVIDER_CHAIN: ${LLM_PROVIDER_CHAIN:-ollama}
      LLM_MODELS: ${LLM_MODELS:-{"ollama":"llama3.2"}}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-ollama}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-all-minilm:33m}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
    volumes:
      - donuthole_exports:/app/exports
    expose:
      - "8343"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8343/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dnsage-network
      - ollama-docker
    restart: always

  frontend:
    build:
      context: ./donut-hole/frontend
      dockerfile: Dockerfile
    container_name: donut-hole-frontend
    environment:
      BACKEND_URL: http://backend:8343
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      HOST: 0.0.0.0
      PORT: 5173
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - dnsage-network
    restart: always

  caddy:
    image: caddy:2.11-alpine
    container_name: dnsage-caddy
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      PIHOLE_DOMAIN: ${PIHOLE_DOMAIN:-pihole.localhost}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      pihole:
        condition: service_started
      frontend:
        condition: service_started
    restart: always
    networks:
      - dnsage-network

volumes:
  pihole_etc:
  pihole_dnsmasq:
  postgres_data:
  pgadmin_data:
  donuthole_exports:
  caddy_data:
  caddy_config:

networks:
  dnsage-network:
    driver: bridge
  ollama-docker:
    external: true
    name: ollama_ollama-docker
